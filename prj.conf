# SHT30-D temperature/humidity sensor with threshold interrupt
CONFIG_REBOOT=y
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_GPIO=y

# SHT3xD: periodic mode required for ALERT threshold to work
CONFIG_SHT3XD_PERIODIC_MODE=y

# Enable SHT3xd trigger (ALERT pin) for threshold wake-up
# Use global thread - trigger is selected automatically when alert-gpios is present
CONFIG_SHT3XD_TRIGGER_GLOBAL_THREAD=y

# Enable printk for serial console output
CONFIG_PRINTK=y

# Bluetooth LE - broadcast breach data + GATT for log retrieval
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="BMWatcherX"
CONFIG_BT_L2CAP_TX_BUF_COUNT=8

# CBOR encoding for compact BLE payload (saves radio time = power)
CONFIG_ZCBOR=y

# LittleFS on QSPI flash for event logs and recycle counter (non-volatile)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_NORDIC_QSPI_NOR=y

# Shell for debugging
CONFIG_SHELL=y
CONFIG_FILE_SYSTEM_SHELL=y

# Stack for main thread (FS + BLE + sensor need enough space)
CONFIG_MAIN_STACK_SIZE=4096

# System work queue runs deferred storage init - needs stack for LittleFS ops
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Heap for LittleFS file cache, buffers, and dynamic allocations
CONFIG_HEAP_MEM_POOL_SIZE=4096
