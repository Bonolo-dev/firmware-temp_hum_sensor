#
# DFU SMP server: allows TempHum to receive firmware updates over BLE.
# Use with: west build -b nrf52840dk/nrf52840 --sysbuild --extra-conf dfu.conf
#
# Requires sysbuild.conf (enables MCUboot). Merge with prj.conf - no conflicts.
#
# SPDX-License-Identifier: LicenseRef-Nordic-5-Clause
#

# MCUboot bootloader (app will be built for slot-0; updates go to slot-1)
CONFIG_BOOTLOADER_MCUBOOT=y

# Nordic MCUmgr OTA DFU bundle (BT transport, image mgmt, reassembly, params)
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU_SPEEDUP=y

# Larger buffers for SMP packets over BLE (speedup uses 498 MTU)
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# MCUmgr transport workqueue (SMP commands need stack)
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608

# Reduce BLE ping overhead (optional)
CONFIG_BT_CTLR_LE_PING=n
